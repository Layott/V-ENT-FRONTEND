/* Layout: a stepladder bracket. "V-ENT today" climbs one step per phase, and each step is joined
   by the live feature it builds on. Wide: left to right as a staircase. Narrow: top to bottom on a
   spine, the feature it builds on joining from the side. Same tokens as globals.css. */
:root {
  color-scheme: dark;
  --ground: #131316;          /* the app-wide page ground (/wallets, /disputes) */
  --panel: #212225;           /* --overlay-gray */
  --raise: #2a2b30;           /* one step up */
  --raise2: #33343a;          /* one more */
  --text: #ffffff;
  --muted: rgba(255, 255, 255, 0.65);
  --faint: rgba(255, 255, 255, 0.45);
  --red: #ED1C24;             /* --v-ent-red */
  --red-hover: #FF0008;       /* --v-ent-light-red */
  --live-bg: rgba(76, 175, 80, 0.18);
  --live: #66bb6a;            /* --v-ent-success-light */
  --wire: rgba(255, 255, 255, 0.24);
  --body: "ClashGrotesk-Variable", "Inter", system-ui, sans-serif;
  --display: "Fraunces", "ClashGrotesk-Variable", Georgia, serif;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--text); font-family: var(--body); }

/* ---------- mockup controls (not part of the page) ---------- */
.mock { padding-inline: 16px; padding-block: 20px 64px; max-width: 1240px; margin: 0 auto; }
.mockBar { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; margin-bottom: 18px; }
.mockNote { margin: 0; color: var(--faint); font-size: 0.85rem; max-width: 70ch; line-height: 1.5; }
.seg { display: inline-flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--panel); }
.seg button { min-height: 40px; padding: 0 14px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font: 500 0.88rem var(--body); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--raise2); color: var(--text); }
.seg button:focus-visible, .node:focus-visible, .btn:focus-visible, .link:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.frame { margin: 0 auto; background: var(--ground); }
.frame.phone { width: 390px; max-width: 100%; padding: 16px; border-radius: 20px; background: #18181b; }
.frameLabel { color: var(--faint); font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; margin: 0 0 10px; }

/* ---------- the page ---------- */
.page { container-type: inline-size; }
.eyebrow { margin: 0 0 0.6rem; font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; color: var(--red); }
h1 { font-family: var(--display); font-weight: 700; letter-spacing: -0.01em; font-size: 2.25rem; margin: 0 0 0.6rem; text-wrap: balance; }
.intro { margin: 0 0 1.8rem; color: var(--muted); line-height: 1.6; max-width: 62ch; }

/* the map: wide = a grid of 48px rows; each card spans two rows, each step drops one row */
.map { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: var(--cols); grid-template-rows: repeat(var(--rows), 48px) auto; column-gap: 0; }
.step { display: contents; }
.node {
  grid-column: var(--c); grid-row: var(--r) / span 2; height: 84px; align-self: start;
  display: flex; flex-direction: column; justify-content: center; gap: 6px; text-align: left;
  padding: 0 14px; border: 0; border-radius: 10px; background: var(--panel); color: var(--text);
  font-family: var(--body); cursor: pointer; min-width: 0;
}
.node:hover { background: var(--raise); }
.node[aria-expanded="true"] { background: var(--raise2); }
.nodeTop { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.phase { font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; color: var(--red); }
.badge { padding: 2px 7px; border-radius: 6px; font-size: 0.7rem; font-weight: 600; background: rgba(255, 255, 255, 0.07); color: var(--muted); white-space: nowrap; }
.badge.live { background: var(--live-bg); color: var(--live); }
.name { font-family: var(--display); font-weight: 700; font-size: 1.08rem; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.feeder {
  grid-column: var(--c); grid-row: var(--r) / span 2; height: 84px; align-self: start;
  display: flex; align-items: center; min-width: 0;
}
.chip { width: 100%; padding: 10px 14px; border-radius: 10px; background: rgba(255, 255, 255, 0.045); min-width: 0; }
.chipLabel { display: block; font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); margin-bottom: 3px; }
.chipName { display: block; font-size: 0.92rem; color: rgba(255, 255, 255, 0.85); line-height: 1.3; }

.wire { grid-column: var(--c); grid-row: var(--r) / span 4; width: 100%; height: 192px; overflow: visible; }
.wire path { fill: none; stroke: var(--wire); stroke-width: 2; }
.wire path.on { stroke: var(--red); }

.detail { grid-column: 1 / -1; grid-row: calc(var(--rows) + 1); margin-top: 28px; padding: 1.4rem 1.4rem 1.3rem; border-radius: 14px; background: var(--panel); }
.detail h2 { font-family: var(--display); font-weight: 700; font-size: 1.5rem; margin: 0.35rem 0 0.4rem; }
.blurb { margin: 0 0 1rem; color: var(--muted); line-height: 1.55; max-width: 62ch; }
.lines { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.lines li { padding: 0.65rem 0.8rem; border-radius: 10px; background: var(--raise); color: rgba(255, 255, 255, 0.85); font-size: 0.92rem; line-height: 1.45; }
.shot { display: block; margin-top: 12px; padding: 0; border: 0; border-radius: 10px; overflow: hidden; background: var(--raise); cursor: zoom-in; max-width: 360px; width: 100%; }
.shot img { display: block; width: 100%; height: auto; }
.shotCap { font-size: 0.8rem; color: var(--faint); margin: 6px 0 0; }
.actions { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-top: 1.1rem; }
.btn { min-height: 48px; padding: 0 1.3rem; border: 0; border-radius: 10px; background: var(--red); color: #fff; font: 600 0.95rem var(--body); cursor: pointer; }
.btn:hover { background: var(--red-hover); }
.link { display: inline-flex; align-items: center; min-height: 48px; padding: 0 1.1rem; border-radius: 10px; background: var(--raise); color: var(--text); text-decoration: none; font-size: 0.92rem; }
.link:hover { background: var(--raise2); }
.done { margin: 0; color: rgba(255, 255, 255, 0.8); }
.done button { min-height: 44px; background: none; border: 0; color: var(--red); font: 600 0.95rem var(--body); cursor: pointer; padding: 0 0.4rem; }
.seeAll { margin: 1.2rem 0 0; }
.seeAll a { color: var(--muted); }

/* narrow: one spine down the left, the feature each step builds on joins from the side */
@container (max-width: 719px) {
  h1 { font-size: 1.5rem; }
  .map { display: flex; flex-direction: column; }
  .step { display: block; }
  .wire { display: none; }
  .node { width: 100%; height: auto; min-height: 68px; padding: 12px 14px; }
  .step.open .node { border-radius: 10px 10px 0 0; background: var(--raise2); }
  .name { white-space: normal; }
  .feeder { position: relative; height: auto; padding: 14px 0 14px 46px; }
  .feeder::before { content: ""; position: absolute; left: 21px; top: 0; bottom: 0; width: 2px; background: var(--wire); }
  .feeder::after { content: ""; position: absolute; left: 21px; top: 50%; width: 25px; height: 2px; background: var(--wire); }
  .feeder.on::before, .feeder.on::after { background: var(--red); }
  .detail { margin-top: 0; border-radius: 0 0 10px 10px; background: var(--raise2); padding: 0.4rem 14px 1rem; }
  .detail h2 { display: none; }
  .detail .nodeTop { display: none; }
  .lines { grid-template-columns: 1fr; }
  .lines li { background: rgba(255, 255, 255, 0.06); }
}

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const state = { view: 'roadmap', width: 'desktop', open: 'shop', told: {} };

// Wide geometry: step k (0-based) has its climber at column 2k+1, row k+1, and the feature it is
// joined by at the same column, row k+3. The next climber sits at column 2k+3, row k+2, centred on
// the pair. A wire column between them carries the elbow.
function mapHtml(steps, focus) {
  const n = steps.length;
  const cols = Array.from({ length: n }, (_, i) => (i ? '40px minmax(0, 1fr)' : 'minmax(0, 1fr)')).join(' ');
  const rows = Math.max(2, n + 2);
  const onPath = (i) => steps.findIndex((s) => s.id === focus) >= i;
  let h = `<ol class="map" style="--cols:${cols};--rows:${rows}">`;
  steps.forEach((s, i) => {
    const open = state.open === s.id;
    const lit = focus && onPath(i);
    if (i > 0) {
      // the feature this step builds on, under the previous climber, and the elbow into this step
      h += `<li class="feeder${lit ? ' on' : ''}" style="--c:${2 * i - 1};--r:${i + 2}"><span class="chip"><span class="chipLabel">Builds on</span><span class="chipName">${esc(s.builds)}</span></span></li>`;
      h += `<li aria-hidden="true" style="display:contents"><svg class="wire" style="--c:${2 * i};--r:${i}" viewBox="0 0 40 192" preserveAspectRatio="none">`
        + `<path class="${lit ? 'on' : ''}" d="M0 42 H20 V90 H40"/><path class="${lit ? 'on' : ''}" d="M0 138 H20 V90"/></svg></li>`;
    }
    h += `<li class="step${open ? ' open' : ''}">`
      + `<button type="button" class="node" style="--c:${2 * i + 1};--r:${i + 1}" aria-expanded="${open}" data-step="${s.id}">`
      + `<span class="nodeTop"><span class="phase">${esc(s.phase)}</span><span class="badge${s.live ? ' live' : ''}">${esc(s.status)}</span></span>`
      + `<span class="name">${esc(s.name)}</span></button>`
      + (open ? detailHtml(s) : '') + `</li>`;
  });
  return h + '</ol>';
}

function detailHtml(s) {
  const told = state.told[s.id];
  return `<div class="detail" role="region" aria-label="${esc(s.name)}">`
    + `<div class="nodeTop"><span class="phase">${esc(s.phase)}</span><span class="badge${s.live ? ' live' : ''}">${esc(s.status)}</span></div>`
    + `<h2>${esc(s.name)}</h2><p class="blurb">${esc(s.blurb)}</p>`
    + `<ul class="lines">${s.lines.map((l) => `<li>${esc(l)}</li>`).join('')}</ul>`
    + (s.shot ? `<button type="button" class="shot" aria-label="${esc(s.shot.alt)}. Tap to enlarge"><img src="${s.shot.src}" alt="${esc(s.shot.alt)}"></button><p class="shotCap">${esc(s.shot.alt)}</p>` : '')
    + (s.live ? '' : `<div class="actions">`
      + (told ? `<p class="done">We will tell you when it opens. <button type="button" data-stop="${s.id}">Stop</button></p>`
              : `<button type="button" class="btn" data-tell="${s.id}">Tell me when it opens</button>`)
      + (state.view === 'roadmap' ? `<a class="link" href="#">Its page</a>` : '') + `</div>`)
    + `</div>`;
}

function render() {
  const page = document.getElementById('page');
  if (state.view === 'roadmap') {
    page.innerHTML = `<h1>What is coming to V-ENT</h1>`
      + `<p class="intro">Everything here grows out of what is live today. Each step opens when it is ready, so there are no dates. Press a step to see what it brings you.</p>`
      + mapHtml(STEPS, state.open);
  } else {
    const at = STEPS.findIndex((s) => s.id === state.view);
    const s = STEPS[at];
    page.innerHTML = `<p class="eyebrow">${esc(s.phase)}</p><h1>${esc(s.name)}</h1>`
      + `<p class="intro">${esc(s.blurb)} Here is how it gets built, from what is live today.</p>`
      + mapHtml(STEPS.slice(0, at + 1), s.id)
      + `<p class="seeAll"><a href="#">Everything on the roadmap</a></p>`;
  }
  const frame = document.getElementById('frame');
  frame.className = 'frame' + (state.width === 'phone' ? ' phone' : '');
  document.getElementById('frameLabel').textContent = state.width === 'phone' ? 'Phone, 390px wide' : 'Desktop content area';
}

document.addEventListener('click', (e) => {
  const v = e.target.closest('[data-view]');
  if (v) {
    state.view = v.dataset.view;
    state.open = state.view === 'roadmap' ? 'shop' : state.view;
    document.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-pressed', String(b === v)));
    return render();
  }
  const w = e.target.closest('[data-width]');
  if (w) {
    state.width = w.dataset.width;
    document.querySelectorAll('[data-width]').forEach((b) => b.setAttribute('aria-pressed', String(b === w)));
    return render();
  }
  const n = e.target.closest('[data-step]');
  if (n) { state.open = state.open === n.dataset.step ? null : n.dataset.step; return render(); }
  const t = e.target.closest('[data-tell]');
  if (t) { state.told[t.dataset.tell] = true; return render(); }
  const st = e.target.closest('[data-stop]');
  if (st) { state.told[st.dataset.stop] = false; return render(); }
  if (e.target.closest('a[href="#"]')) e.preventDefault();
});

render();
</script>

</body>
</html>
