:root {
  --bg: #131316;
  --panel: #212225;
  --step: #2a2b30;
  --step2: #33343a;
  --text: #F2F2F3;
  --muted: rgba(255, 255, 255, 0.58);
  --faint: rgba(255, 255, 255, 0.38);
  --red: #ED1C24;
  --red-soft: rgba(237, 28, 36, 0.24);
  --gold: #D4AF37;
  --gold-light: #E8C760;
  --gold-soft: rgba(212, 175, 55, 0.2);
  --green: #4caf50;
  --green-soft: rgba(76, 175, 80, 0.18);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--text); }
body { font-family: "ClashGrotesk-Variable", Arial, sans-serif; font-weight: 400; font-size: 15px; line-height: 1.45; }
h1, h2, h3 { font-family: "Fraunces", Georgia, serif; font-weight: 700; letter-spacing: -0.01em; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--gold-light); outline-offset: 2px; }
input, select { font: inherit; color: var(--text); background: var(--step); border: 0; border-radius: 10px; padding: 0 12px; min-height: 44px; }
a { color: inherit; }

/* The mockup's own chrome: which screen, which width. */
.mockbar { position: sticky; top: 0; z-index: 30; background: #0e0e10; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.mockbar .brand { font-weight: 700; color: var(--red); margin-right: 8px; white-space: nowrap; }
.mockbar .note { color: var(--faint); font-size: 12px; margin-right: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 36px; padding: 0 12px; border-radius: 8px; background: var(--step); color: var(--muted); font-size: 13px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--gold); color: #17140a; font-weight: 600; }
.chip.red[aria-pressed="true"] { background: var(--red); color: #fff; }
.mockbar .chip { min-height: 32px; }

.wrap { max-width: 1240px; margin: 0 auto; padding: 24px 16px 80px; }
.screen { display: none; }
.screen.on { display: block; }
.frame { container-type: inline-size; margin: 0 auto; background: var(--bg); }
body.phone { background: #0b0b0d; }
body.phone .frame { max-width: 390px; background: var(--bg); padding: 0 0 8px; }
.explain { color: var(--faint); font-size: 12.5px; max-width: 76ch; margin: 0 auto 18px; }
body.phone .explain { max-width: 390px; }

/* Shared V-ENT pieces, read off /events/<slug> and its console (12 Oct 2026). */
.hero { background: #1b1b1f; border-radius: 16px; padding: 28px 32px; margin-bottom: 18px; }
.hero .pill { display: inline-block; background: var(--red-soft); color: #ff6b70; font-size: 11px; font-weight: 700; letter-spacing: .06em; border-radius: 6px; padding: 3px 8px; text-transform: uppercase; }
.hero h1 { font-size: 40px; margin: 10px 0 8px; }
.hero .meta { color: var(--muted); font-size: 13px; display: flex; gap: 18px; flex-wrap: wrap; }
.tabs { display: flex; gap: 4px; overflow-x: auto; margin: 6px 0 22px; padding-bottom: 2px; }
.tab { min-height: 44px; padding: 0 14px; border-radius: 8px; color: var(--muted); font-weight: 600; font-size: 14px; white-space: nowrap; }
.tab[aria-pressed="true"] { color: var(--text); background: var(--step); }
.consoletabs .tab { background: var(--step); color: var(--muted); font-weight: 500; }
.consoletabs .tab[aria-pressed="true"] { background: var(--gold); color: #17140a; font-weight: 600; }
.panel { background: var(--panel); border-radius: 14px; padding: 20px; }
.panel + .panel { margin-top: 14px; }
.inner { background: var(--step); border-radius: 12px; padding: 14px 16px; }
.btn { min-height: 44px; padding: 0 16px; border-radius: 10px; font-weight: 600; font-size: 14px; background: var(--step2); color: var(--text); white-space: nowrap; }
.btn.red { background: var(--red); color: #fff; }
.btn.gold { background: var(--gold); color: #17140a; }
.btn.quiet { background: var(--step); color: var(--muted); }
.btn.in { background: var(--green-soft); color: #8fd492; }
.btn[disabled] { opacity: .5; cursor: default; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 12.5px; }
.label { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
h2.sect { font-size: 26px; margin-bottom: 4px; }
h3.sub { font-size: 19px; margin-bottom: 6px; }

/* The games on an event. Rows, not a grid of identical cards: the thumbnail,
   then what and when, then the one thing you can do. */
.glist { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.grow { display: grid; grid-template-columns: 132px 1fr auto; gap: 16px; align-items: center; background: var(--panel); border-radius: 14px; padding: 12px; }
.thumb { width: 132px; height: 76px; border-radius: 10px; background: #1a1a1e; display: block; }
.gname { font-weight: 650; font-size: 17px; }
.gmeta { color: var(--muted); font-size: 13px; }
.places { font-size: 12.5px; color: var(--muted); margin-top: 6px; display: flex; align-items: center; gap: 8px; }
.meter { width: 120px; height: 6px; border-radius: 3px; background: var(--step2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--gold); border-radius: 3px; }
.gacts { display: flex; gap: 8px; align-items: center; }
.tag { display: inline-block; font-size: 11px; font-weight: 600; border-radius: 6px; padding: 2px 7px; background: var(--step2); color: var(--muted); }
.tag.gold { background: var(--gold-soft); color: var(--gold-light); }
.tag.green { background: var(--green-soft); color: #8fd492; }
.tag.red { background: var(--red-soft); color: #ff8a8e; }

.ticketbar { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--step); border-radius: 12px; padding: 12px 16px; margin-top: 14px; }

/* Vote */
.vote { margin-top: 18px; }
.vopt { width: 100%; text-align: left; display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 10px; background: var(--step); border-radius: 10px; padding: 8px 12px 8px 8px; min-height: 52px; }
.vopt + .vopt { margin-top: 6px; }
.vopt .box { width: 28px; height: 28px; border-radius: 8px; background: var(--step2); display: grid; place-items: center; margin-left: 6px; }
.vopt[aria-pressed="true"] { background: var(--gold-soft); }
.vopt[aria-pressed="true"] .box { background: var(--gold); }
.vopt[aria-pressed="true"] .box::after { content: ""; width: 10px; height: 10px; border-radius: 3px; background: #17140a; }
.bar { height: 8px; border-radius: 4px; background: var(--step2); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--gold); }

/* How to play: the sheet. */
.sheetback { position: fixed; inset: 0; background: rgba(8, 8, 10, .72); z-index: 50; display: none; align-items: center; justify-content: center; padding: 16px; }
.sheetback.on { display: flex; }
.sheet { background: var(--panel); border-radius: 16px; width: min(1060px, 100%); max-height: calc(100vh - 32px); overflow: auto; display: grid; grid-template-columns: 1.45fr 1fr; }
body.phone .sheet { width: 390px; grid-template-columns: 1fr; border-radius: 16px 16px 0 0; }
.sheetback.phoneish .sheet { grid-template-columns: 1fr; }
.stagebox { padding: 16px; background: #18181b; border-radius: 16px 0 0 16px; display: flex; flex-direction: column; gap: 12px; }
body.phone .stagebox { border-radius: 16px 16px 0 0; }
.stage { width: 100%; aspect-ratio: 16 / 9; display: block; border-radius: 12px; background: #1e1e22; }
.stepdots { display: flex; gap: 6px; }
.stepdots button { flex: 1; min-height: 44px; border-radius: 8px; background: var(--step); color: var(--muted); font-size: 12px; font-weight: 600; }
.stepdots button[aria-pressed="true"] { background: var(--gold); color: #17140a; }
.sheetbody { padding: 22px 22px 20px; display: flex; flex-direction: column; gap: 14px; }
.steps { list-style: none; counter-reset: s; display: flex; flex-direction: column; gap: 8px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 8px 10px; border-radius: 10px; color: var(--muted); }
.steps li::before { content: counter(s); width: 26px; height: 26px; border-radius: 8px; background: var(--step2); display: grid; place-items: center; font-weight: 700; font-size: 13px; color: var(--muted); }
.steps li.now { background: var(--step); color: var(--text); }
.steps li.now::before { background: var(--gold); color: #17140a; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.fact { background: var(--step); border-radius: 10px; padding: 9px 12px; }
.fact b { display: block; font-weight: 600; font-size: 14px; }

.ghead { display: grid; grid-template-columns: 96px 1fr auto; gap: 14px; align-items: center; }

.who span { background: var(--step2); border-radius: 8px; padding: 4px 9px; font-size: 12.5px; }

.fields { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.fields label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--faint); }
.catgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px; margin-top: 12px; }

.progress span.now { background: var(--gold); }

.tick { display: grid; grid-template-columns: 34px 64px 1fr; gap: 10px; align-items: center; background: var(--step); border-radius: 10px; padding: 8px 12px 8px 8px; min-height: 56px; width: 100%; text-align: left; }
.tick + .tick { margin-top: 6px; }
.tick .box { width: 26px; height: 26px; border-radius: 8px; background: var(--step2); margin-left: 4px; display: grid; place-items: center; }
.tick[aria-pressed="true"] { background: var(--gold-soft); }
.tick[aria-pressed="true"] .box { background: var(--gold); }
.tick[aria-pressed="true"] .box::after { content: ""; width: 9px; height: 9px; border-radius: 3px; background: #17140a; }
.tick .thumb { width: 64px; height: 36px; border-radius: 6px; }
.tier { display: grid; grid-template-columns: 1fr auto; gap: 8px; background: var(--step); border-radius: 12px; padding: 12px 14px; width: 100%; text-align: left; min-height: 56px; }
.tier + .tier { margin-top: 6px; }
.tier[aria-pressed="true"] { background: var(--gold-soft); }
.saved { background: var(--green-soft); color: #a9dcab; border-radius: 10px; padding: 10px 12px; font-size: 13px; }
.resume { background: var(--step); border-radius: 14px; padding: 16px; }

/* All 50 */
.allgames { width: 100%; border-collapse: separate; border-spacing: 0 6px; }
.allgames th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); padding: 4px 10px; }
.allgames td { background: var(--panel); padding: 10px; font-size: 13.5px; vertical-align: middle; }
.allgames td:first-child { border-radius: 10px 0 0 10px; }
.allgames td:last-child { border-radius: 0 10px 10px 0; }
.allgames .thumb { width: 96px; height: 54px; }
.allgames .n { font-weight: 650; font-size: 15px; }

.decide { counter-reset: q; display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.decide li { list-style: none; counter-increment: q; background: var(--panel); border-radius: 12px; padding: 12px 14px 12px 50px; position: relative; }
.decide li::before { content: counter(q); position: absolute; left: 14px; top: 12px; width: 24px; height: 24px; border-radius: 7px; background: var(--gold); color: #17140a; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.decide b { display: block; margin-bottom: 2px; }

/* Phone: the same pieces, narrower. */
@container (max-width: 640px) {
  .hero { padding: 20px 18px; }
  .hero h1 { font-size: 28px; }
  .grow { grid-template-columns: 96px 1fr; gap: 12px; }
  .grow .thumb { width: 96px; height: 56px; }
  .gacts { grid-column: 1 / -1; }
  .gacts .btn { flex: 1; }
  .fields { grid-template-columns: 1fr 1fr; }
  .ghead { grid-template-columns: 80px 1fr; }
  .ghead .thumb { width: 80px; height: 46px; }
  .ghead > .gacts { grid-column: 1 / -1; }
  .allgames thead { display: none; }
  .allgames tr { display: grid; grid-template-columns: 96px 1fr; background: var(--panel); border-radius: 12px; margin-bottom: 8px; padding: 6px; gap: 0 10px; }
  .allgames td { background: none; padding: 4px; border-radius: 0 !important; }
  .allgames td.hide-s { display: none; }
  .allgames td:first-child { grid-row: span 3; }
  h2.sect { font-size: 22px; }
  .modal { padding: 18px 16px; }
}
@media (max-width: 760px) {
  .sheet { grid-template-columns: 1fr; }
  .stagebox { border-radius: 16px 16px 0 0; }
}
@media (prefers-reduced-motion: reduce) {
  .actor { transition: none !important; }
}
.actor { transition: transform 0.85s cubic-bezier(.4, .1, .2, 1), opacity 0.5s ease; }

const MOVE_KEYS = ['x', 'y', 'r', 's', 'o'];

function states(game) {
  const first = {};
  for (const [id, [t, x, y, p]] of Object.entries(game.cast)) first[id] = Object.assign({ t, x, y, r: 0, s: 1, o: 1 }, p);
  const all = [first];
  for (const step of game.play) {
    const prev = all[all.length - 1];
    const next = {};
    for (const id of Object.keys(prev)) next[id] = Object.assign({}, prev[id], step[id] || {});
    all.push(next);
  }
  return all; // all[0] is the cast before step 1; all[i] is after step i
}

function looks(a) {
  const o = {};
  for (const k of Object.keys(a)) if (!MOVE_KEYS.includes(k)) o[k] = a[k];
  return JSON.stringify(o);
}

function place(g, a) {
  g.style.transform = `translate(${a.x}px, ${a.y}px) rotate(${a.r}deg) scale(${a.s})`;
  g.style.opacity = String(a.o);
}

// A still frame, for thumbnails and tables.
function stillSVG(game, at) {
  const all = states(game);
  const st = all[Math.min(at ?? 2, all.length - 1)];
  let body = `<rect width="320" height="180" fill="${STAGE}"/>`;
  for (const id of Object.keys(st)) {
    const a = st[id];
    body += `<g transform="translate(${a.x},${a.y}) rotate(${a.r}) scale(${a.s})" opacity="${a.o}">${shape(a.t, a)}</g>`;
  }
  return `<svg class="thumb" viewBox="0 0 320 180" role="img" aria-label="${esc(game.name)}">${body}</svg>`;
}

// The player, for the explainer sheet.
function Player(svg, game, onStep) {
  const all = states(game);
  const nodes = {};
  const NS = 'http://www.w3.org/2000/svg';
  svg.innerHTML = `<rect width="320" height="180" fill="${STAGE}"/>`;
  const seen = {};
  for (const id of Object.keys(all[0])) {
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'actor');
    g.style.transition = 'none';
    g.innerHTML = shape(all[0][id].t, all[0][id]);
    place(g, all[0][id]);
    svg.appendChild(g);
    nodes[id] = g;
    seen[id] = looks(all[0][id]);
  }
  let timer = null;
  let now = 0;
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function show(i, still) {
    now = i;
    const st = all[i];
    for (const id of Object.keys(st)) {
      const g = nodes[id];
      g.style.transition = still || reduce ? 'none' : '';
      const l = looks(st[id]);
      if (l !== seen[id]) { g.innerHTML = shape(st[id].t, st[id]); seen[id] = l; }
      place(g, st[id]);
    }
    onStep(i);
  }
  function stop() { if (timer) { clearTimeout(timer); timer = null; } }
  function play() {
    stop();
    show(0, true);
    if (reduce) { show(1, true); return; }
    const advance = (i) => {
      timer = setTimeout(() => { show(i); if (i < all.length - 1) advance(i + 1); else timer = null; }, i === 1 ? 450 : 2600);
    };
    advance(1);
  }
  return { play, stop, go(i) { stop(); show(i); }, get now() { return now; }, last: all.length - 1 };
}

        : `<div class="muted small" style="margin-top:6px">The count shows once you have voted. One vote per ticket.</div>`}</div>`;
  }
  return `<div class="panel vote"><div class="label">Vote, closes ${VOTE.closes}</div><h3 class="sub">${VOTE.question}</h3><div class="muted small" style="margin-bottom:10px">Pick up to ${VOTE.pick}. One vote per ticket. The organiser runs the winners.</div>
    ${VOTE.options.map((k) => `<button class="vopt" data-vote="${k}" aria-pressed="${state.votes.has(k)}"><span class="box"></span><span><b>${BY[k].name}</b> <span class="muted small">${from(BY[k])}</span></span><span class="muted small" data-how="${k}" role="link">How to play</span></button>`).join('')}
    <div class="row" style="margin-top:12px"><button class="btn gold" data-sendvote ${state.votes.size ? '' : 'disabled'}>Send my vote</button><span class="muted small">${state.votes.size} of ${VOTE.pick} picked</span></div></div>`;
}

function organiserScreen() {
  const tabs = ['Details', 'Tickets', 'Money', 'Sales and attendance', 'Messages', 'Polls', 'Games', 'Programme', 'Run of show', 'Waiting list', 'Team'];
  const rows = ON.filter((o) => state.added.has(o.key)).map((o) => {
    const g = BY[o.key];
    const open = state.open === g.key;
    const names = ['Tolu A. (Regular)', 'Kwame B. (VIP)', 'Amaka O. (Regular)', 'Musa I. (Regular)', 'Ife D. (VIP)', 'Chidi N. (Regular)', 'Wanjiru K. (Regular)', 'Sipho M. (Guest, no account)'];
    return `<div class="inner" style="margin-top:8px"><div class="ghead">${stillSVG(g)}<div><div class="gname" style="font-size:15px">${g.name}</div><div class="gmeta">${o.when} · ${o.where}</div>
      <div class="places">${o.signed} want to play${o.places ? ` · ${o.places} places` : ' · no limit'}${o.places && o.signed >= o.places ? ' · <span class="tag red">Full</span>' : ''}</div></div>
      <div class="gacts"><button class="btn quiet" data-open="${g.key}">${open ? 'Hide' : 'Who and when'}</button></div></div>
      ${open ? `<div class="fields"><label>When<input value="${o.when}"></label><label>Where<input value="${o.where}"></label><label>Places<input value="${o.places || ''}" placeholder="No limit"></label><label>Prize (optional)<input value="${o.prize}" placeholder="What the winner gets"></label></div>
        <div class="label" style="margin-top:14px">Who wants to play (${o.signed})</div><div class="who">${names.slice(0, Math.min(8, o.signed)).map((n) => `<span>${n.replace(/ \(.*/, '')}<em>${n.match(/\((.*)\)/)[1]}</em></span>`).join('')}${o.signed > 8 ? `<span class="muted">and ${o.signed - 8} more</span>` : ''}</div>
        <div class="row" style="margin-top:12px"><button class="btn gold">Save</button><button class="btn">Message these players</button><button class="btn">Download the list</button><button class="btn quiet">Close sign ups</button><button class="btn quiet">Take this game off</button></div>` : ''}</div>`;
  }).join('');

  const pool = GAMES.filter((g) => (state.region === 'all' || g.region === state.region) && (state.kind === 'all' || g.kind === state.kind) && (!state.q || (g.name + g.origin).toLowerCase().includes(state.q.toLowerCase())));
  const cat = pool.map((g) => `<div class="catitem">${stillSVG(g)}<div><div class="t">${g.name}</div><div class="m">${from(g)} · ${g.players} · ${g.time}</div></div>
    <div class="acts"><button class="btn quiet" data-how="${g.key}">Preview</button><button class="btn ${state.added.has(g.key) ? 'in' : 'gold'}" data-add="${g.key}">${state.added.has(g.key) ? 'On your event' : 'Add'}</button></div></div>`).join('') || '<p class="muted">Nothing matches. Clear the search or pick another region.</p>';

  const total = VOTE.counts.reduce((a, b) => a + b, 0);
  const pollPanel = state.poll === 'draft'
    ? `<div class="muted small">Not sure which games your crowd wants? Put some to a vote first. Votes are one per ticket and the vote also shows under Polls.</div>
       <div class="label" style="margin-top:12px">Put these to the vote</div>
       ${GAMES.filter((g) => VOTE.options.includes(g.key) || ['quiz-night', 'jenga'].includes(g.key)).map((g) => `<button class="tick" data-cand="${g.key}" aria-pressed="${state.candidates.has(g.key)}"><span class="box"></span>${stillSVG(g)}<span><b>${g.name}</b><br><span class="muted small">${from(g)}</span></span></button>`).join('')}
       <div class="fields" style="grid-template-columns:repeat(3,minmax(0,1fr))"><label>Question<input value="${VOTE.question}"></label><label>Each person picks up to<input value="3"></label><label>Voting closes<input value="${VOTE.closes}"></label></div>
       <div class="row" style="margin-top:12px"><button class="btn gold" data-poll="open">Open the vote</button><span class="muted small">${state.candidates.size} games in the vote</span></div>`
    : `<div class="spread"><div><div class="label">Open, closes ${VOTE.closes}</div><b>${VOTE.question}</b></div><span class="tag green">${total} votes from 96 tickets</span></div>
       ${VOTE.options.map((k, i) => ({ k, n: VOTE.counts[i] })).sort((a, b) => b.n - a.n).map((r, i) => `<div style="margin-top:10px"><div class="spread small"><span>${i + 1}. ${BY[r.k].name}</span><span class="muted">${r.n} votes</span></div><div class="bar"><i style="width:${Math.round((r.n / 60) * 100)}%"></i></div></div>`).join('')}
       <div class="row" style="margin-top:14px"><button class="btn gold">Run the top 3</button><button class="btn">Close the vote</button><span class="muted small">Running a game adds it to your games with sign ups open; you set the time and place.</span></div>`;

  return `<p class="explain">The organiser's console gets a Games tab. Add games from the catalogue (or your own), set when, where and how many places, see who wants to play, and put games to a vote first if you like.</p>
  <div class="frame"><a class="muted small">Back to the event</a><div class="spread" style="margin:6px 0 4px"><h1 style="font-size:32px">Run this event</h1><button class="btn gold">Open the door scanner</button></div>
  <div class="tabs consoletabs">${tabs.map((t) => `<button class="tab" aria-pressed="${t === 'Games'}">${t}</button>`).join('')}</div>
  <div class="panel"><div class="spread"><div><h3 class="sub">Games at your event</h3><div class="muted small">Only people holding a ticket can sign up. A ticket that is refunded or voided drops its games.</div></div><span class="tag gold">${ON.reduce((a, o) => a + o.signed, 0)} sign ups</span></div>${rows}</div>
  <div class="panel"><h3 class="sub">Let people vote</h3>${pollPanel}</div>
  <div class="panel"><div class="spread"><h3 class="sub">Add games</h3><span class="muted small">${GAMES.length} games, each with how to play and an animation</span></div>
    <div class="row" style="margin-top:8px">${[['africa', 'Africa'], ['uk', 'United Kingdom'], ['world', 'Worldwide'], ['all', 'All']].map(([k, t]) => `<button class="chip" data-region="${k}" aria-pressed="${state.region === k}">${t}</button>`).join('')}
      <select data-kind aria-label="Kind of game"><option value="all">Every kind</option>${Object.entries(KINDS).map(([k, t]) => `<option value="${k}" ${state.kind === k ? 'selected' : ''}>${t}</option>`).join('')}</select>
      <input data-q placeholder="Search games" value="${state.q}" aria-label="Search games"></div>
    <div class="catgrid">${cat}</div></div>
  <div class="panel"><h3 class="sub">Your own game</h3><div class="muted small">Something not in the list? Name it and say how it is played. It gets the same sign up and vote, without an animation.</div>
    <div class="fields"><label>Name<input placeholder="e.g. Cosplay trivia"></label><label>Players<input placeholder="e.g. 4 to 20"></label><label>How long<input placeholder="e.g. 20 min"></label><label>You need<input placeholder="e.g. a mic"></label></div>
    <label class="small faint" style="display:flex;flex-direction:column;gap:4px;margin-top:8px">How to play, step by step<input placeholder="One step per line"></label>
    <div class="row" style="margin-top:12px"><button class="btn gold">Add this game</button></div></div></div>`;
}

function checkoutScreen() {
  const list = ON.slice(0, 5).map((o) => {
    const g = BY[o.key];
    const full = o.places && o.signed >= o.places;
    return `<button class="tick" data-co="${g.key}" aria-pressed="${state.checkout.has(g.key)}"><span class="box"></span>${stillSVG(g)}<span><b>${g.name}</b>${full ? ' <span class="tag red">Waiting list</span>' : ''}<br><span class="muted small">${o.when}</span></span></button>`;
  }).join('');
  return `<p class="explain">Buying a ticket gains one optional step: the event's games, ticked or not. Picks are kept on the ticket, so a guest with no account can change them later from the ticket link in their email.</p>
  <div class="frame"><div class="modal"><div class="label">${EVENT.name}</div><h2 class="sect" style="font-size:24px">Your tickets</h2>
    <div class="progress"><span class="done"></span><span class="done"></span><span class="now"></span><span></span></div>
    <div class="steplabels"><span>Ticket</span><span>Who it's for</span><span>Games</span><span>Pay</span></div>
    <h3 class="sub">Want to play any games?</h3><div class="muted small" style="margin-bottom:10px">Optional. Tick the ones you'd like to play and you're signed up with this ticket. You can change it later.</div>
    ${list}
    <div class="row" style="margin-top:8px"><button class="btn quiet" data-how="whot">How to play Whot</button><span class="muted small">Every game has its explainer</span></div>
    <div class="spread" style="margin-top:18px"><div><b>1 x Regular, both days</b><div class="muted small">5,000 naira, or 5 VENT COINS</div></div><button class="btn red">Continue to pay</button></div></div></div>`;
}

function registerScreen() {
  const saved = `<div class="saved">Saved 14:02. Leave and come back from any device you sign in on; your registration waits here for 30 days.</div>`;
  const tiers = [['regular', 'Regular, both days', '5,000 naira · 5 VC', 'Enters you in this tournament'], ['vip', 'VIP, both days', '15,000 naira · 15 VC', 'Enters you in this tournament, front row seats']]
    .map(([k, n, p, d]) => `<button class="tier" data-tier="${k}" aria-pressed="${state.tier === k}"><span><b>${n}</b><br><span class="muted small">${d}</span></span><b>${p}</b></button>`).join('');
  const pays = [['coins', 'VENT COINS', 'You have 3 VC, 2 short. Top up and come straight back.'], ['card', 'Card, bank or USSD', 'Paystack or Flutterwave. You return to this step when it is paid.']]
    .map(([k, n, d]) => `<button class="tier" data-pay="${k}" aria-pressed="${state.pay === k}"><span><b>${n}</b><br><span class="muted small">${d}</span></span></button>`).join('');
  const step = state.reg === 'ticket'
    ? `<div class="progress"><span class="done"></span><span class="done"></span><span class="now"></span><span></span><span></span></div>
       <div class="steplabels"><span>Solo or team</span><span>Team</span><span>Event ticket</span><span>Review</span><span>Done</span></div>
       ${saved}
       <h3 class="sub" style="margin-top:14px">Entry is a ticket for ${EVENT.name}</h3>
       <div class="muted small" style="margin-bottom:10px">The organiser made the event ticket your entry to this tournament. Get it here; you don't lose anything you've filled in.</div>
       ${tiers}<div class="label" style="margin:14px 0 6px">Pay with</div>${pays}
       <div class="spread" style="margin-top:16px"><button class="btn quiet" data-reg="resume">Leave and come back later</button><button class="btn gold" data-reg="review">Get the ticket and continue</button></div>`
    : state.reg === 'review'
      ? `<div class="progress"><span class="done"></span><span class="done"></span><span class="done"></span><span class="now"></span><span></span></div>
         <div class="steplabels"><span>Solo or team</span><span>Team</span><span>Event ticket</span><span>Review</span><span>Done</span></div>
         <div class="saved">Ticket VNT-3H7R is yours and is your entry. It is in My tickets, and on the email we sent.</div>
         <h3 class="sub" style="margin-top:14px">Review</h3>
         <div class="facts"><div class="fact"><span class="label">Team</span><b>Team Vermillion</b></div><div class="fact"><span class="label">Players</span><b>4 of 4</b></div><div class="fact"><span class="label">Entry</span><b>Event ticket, Regular</b></div><div class="fact"><span class="label">To pay now</span><b>Nothing</b></div></div>
         <div class="spread" style="margin-top:16px"><button class="btn quiet" data-reg="ticket">Back</button><button class="btn gold">Register Team Vermillion</button></div>`
      : `<div class="resume"><div class="label">Pick up where you left off</div><h3 class="sub" style="margin-top:4px">You were registering Team Vermillion for Naija Free Fire Weekly</h3>
         <div class="muted small">Done: solo or team, team and players. Next: your ticket for ${EVENT.name}. Saved Sat 31 Oct, 14:02.</div>
         <div class="row" style="margin-top:12px"><button class="btn gold" data-reg="ticket">Continue</button><button class="btn quiet">Start again</button></div></div>
         <p class="muted small" style="margin-top:12px">This card shows on the tournament page, on the event's Tournaments tab and under My tournaments, wherever the person comes back in.</p>`;
  return `<p class="explain">A tournament inside an event whose entry is the event ticket. Today the registration is refused with "Entry to this tournament is a ticket for..." and the player starts again after buying one. Here the ticket is a step inside the registration, and the registration is saved on the server at every step.</p>
  <div class="frame"><div class="modal"><div class="label">Naija Free Fire Weekly · at ${EVENT.name}</div><h2 class="sect" style="font-size:24px">Register</h2>${step}</div></div>`;
}

function allScreen() {
  return `<p class="explain">The catalogue: 20 from Africa, 12 from the United Kingdom, 18 played worldwide. Press Preview for each explainer and animation. Names, explainers and every word in the animations ship in English, French and Portuguese.</p>
  <div class="frame">${REGIONS.map((r) => {
    const list = GAMES.filter((g) => g.region === r.key);
    return `<h2 class="region">${r.name} (${list.length})</h2><div class="muted small" style="margin-bottom:6px">${r.note}</div>
    <table class="allgames"><thead><tr><th></th><th>Game</th><th>Players</th><th>Time</th><th class="hide-s">You need</th><th class="hide-s">Age</th><th></th></tr></thead><tbody>
    ${list.map((g) => `<tr><td>${stillSVG(g)}</td><td><div class="n">${g.name}</div><div class="muted small">${g.origin} · ${KINDS[g.kind]}</div></td><td>${g.players}</td><td>${g.time}</td><td class="hide-s muted">${g.needs}</td><td class="hide-s muted">${g.age}</td><td><button class="btn quiet" data-how="${g.key}">Preview</button></td></tr>`).join('')}
    </tbody></table>`;
  }).join('')}</div>`;
}

function readmeScreen() {
  return `<div class="frame"><h1 style="font-size:34px;margin-bottom:6px">Party games at events</h1>
  <p class="muted" style="max-width:70ch">What you asked for on 12 October, as screens to approve before anything is built. Use the chips at the top to move between them, and "Phone width" to see each at 390 pixels.</p>
  <ol class="decide">
    <li><b>50 games, Africa first</b>20 from Africa (Whot, Ludo, Ayo and Oware, Ten-Ten, Ampe, Afro Dance-Off, 30 Seconds, Morabaraba, EA FC winner stays on and more), 12 British, 18 worldwide. Each has a one line summary, steps, how to win, players, time, what you need, an age, and an animation that plays the steps.</li>
    <li><b>A Games tab on every event</b>Public, like the rest of the event page: anybody can read how each game works. Playing needs a ticket.</li>
    <li><b>Interest is a sign up</b>"I want to play" puts you on the game with your ticket, so the organiser sees exactly who wants what. A full game takes a waiting list. A refunded or voided ticket drops its games.</li>
    <li><b>Pick games while buying, or after</b>An optional step in checkout, and the Games tab afterwards. Guests with no account change their picks from their ticket link.</li>
    <li><b>The organiser's vote</b>Put any games to a vote, one vote per ticket, then run the winners with one press. It is built on the event polls you already have, so it also appears under Polls.</li>
    <li><b>Organisers can add their own game</b>Same sign up and vote, without an animation.</li>
    <li><b>The ticket inside a tournament registration</b>Where the event ticket is the entry, buying it is a step of the registration, and the registration is saved on the server at every step for 30 days, on any device.</li>
  </ol></div>`;
}

function render() {
  chipsBar();
  const s = state.screen;
  app.innerHTML = s === 'event' ? eventScreen() : s === 'organiser' ? organiserScreen() : s === 'checkout' ? checkoutScreen() : s === 'register' ? registerScreen() : s === 'all' ? allScreen() : readmeScreen();
}

let player = null;
function openSheet(key) {
  const g = BY[key];
  const back = $('#sheetback');
  back.innerHTML = `<div class="sheet"><div class="stagebox"><svg class="stage" viewBox="0 0 320 180" role="img" aria-label="${g.name}, played step by step"></svg>
    <div class="stepdots">${g.steps.map((_, i) => `<button data-step="${i + 1}" aria-pressed="false">Step ${i + 1}</button>`).join('')}</div>
    <div class="row"><button class="btn quiet" data-replay>Play again</button><span class="faint small">${g.origin}</span></div></div>
    <div class="sheetbody"><div class="spread"><div><div class="label">${KINDS[g.kind]} · ${REGIONS.find((r) => r.key === g.region).name}</div><h2 class="sect">${g.name}</h2></div><button class="btn quiet" data-close aria-label="Close">Close</button></div>
    <p class="muted">${g.summary}</p>
    <ol class="steps">${g.steps.map((t) => `<li>${t}</li>`).join('')}</ol>
    <div class="facts"><div class="fact"><span class="label">Players</span><b>${g.players}</b></div><div class="fact"><span class="label">Time</span><b>${g.time}</b></div><div class="fact"><span class="label">You need</span><b>${g.needs}</b></div><div class="fact"><span class="label">Age</span><b>${g.age}</b></div></div>
    <div class="inner"><span class="label">How to win</span><div>${g.win}</div></div>
    ${ON.find((o) => o.key === key) ? `<button class="btn gold">${state.mine.has(key) ? "You're in" : 'I want to play'}</button>` : ''}</div></div>`;
  back.classList.add('on');
  const lis = [...back.querySelectorAll('.steps li')];
  const dots = [...back.querySelectorAll('.stepdots button')];
  player = Player(back.querySelector('svg'), g, (i) => {
    lis.forEach((li, n) => li.classList.toggle('now', n === i - 1));
    dots.forEach((d, n) => d.setAttribute('aria-pressed', String(n === i - 1)));
  });
  player.play();
  back.querySelector('[data-close]').focus();
}
function closeSheet() { if (player) player.stop(); $('#sheetback').classList.remove('on'); $('#sheetback').innerHTML = ''; }

document.addEventListener('click', (e) => {
  const t = e.target.closest('button, [data-how]');
  if (!t) { if (e.target.id === 'sheetback') closeSheet(); return; }
  const d = t.dataset;
  if (d.screen) { state.screen = d.screen; render(); window.scrollTo(0, 0); return; }
  if (d.how) { e.stopPropagation(); openSheet(d.how); return; }
  if (d.close !== undefined) { closeSheet(); return; }
  if (d.replay !== undefined) { player && player.play(); return; }
  if (d.step) { player && player.go(Number(d.step)); return; }
  if (d.viewer) { state.viewer = d.viewer; render(); return; }
  if (d.mine) { state.mine.has(d.mine) ? state.mine.delete(d.mine) : state.mine.add(d.mine); render(); return; }
  if (d.vote) { if (state.votes.has(d.vote)) state.votes.delete(d.vote); else if (state.votes.size < VOTE.pick) state.votes.add(d.vote); render(); return; }
  if (d.sendvote !== undefined) { state.voted = true; render(); return; }
  if (d.open) { state.open = state.open === d.open ? '' : d.open; render(); return; }
  if (d.add) { state.added.has(d.add) ? state.added.delete(d.add) : state.added.add(d.add); render(); return; }
  if (d.region) { state.region = d.region; render(); return; }
  if (d.cand) { state.candidates.has(d.cand) ? state.candidates.delete(d.cand) : state.candidates.add(d.cand); render(); return; }
  if (d.poll) { state.poll = d.poll; render(); return; }
  if (d.co) { state.checkout.has(d.co) ? state.checkout.delete(d.co) : state.checkout.add(d.co); render(); return; }
  if (d.reg) { state.reg = d.reg; render(); return; }
  if (d.tier) { state.tier = d.tier; render(); return; }
  if (d.pay) { state.pay = d.pay; render(); return; }
});
document.addEventListener('change', (e) => { if (e.target.matches('[data-kind]')) { state.kind = e.target.value; render(); } });
document.addEventListener('input', (e) => {
  if (e.target.matches('[data-q]')) { state.q = e.target.value; const pos = e.target.selectionStart; render(); const box = $('[data-q]'); box.focus(); box.setSelectionRange(pos, pos); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });
$('#phonebtn').addEventListener('click', (e) => {
  const on = !document.body.classList.contains('phone');
  document.body.classList.toggle('phone', on);
  e.currentTarget.setAttribute('aria-pressed', String(on));
});
render();

</script>
</body>
</html>
