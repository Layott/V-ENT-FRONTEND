:root {
  --v-ent-gold: #D4AF37;
  --v-ent-light-gold: #E8C760;
  --v-ent-red: #ED1C24;
  --v-ent-success: #4caf50;
  --v-ent-success-light: #66bb6a;
  --v-ent-success-deep: #2e7d32;
  --overlay-gray: #212225;
}
* { box-sizing: border-box; font-family: 'ClashGrotesk-Variable', sans-serif; }
html, body { margin: 0; background: #131316; color: rgba(255,255,255,0.92); -webkit-font-smoothing: antialiased; }
.page { max-width: 1240px; margin: 0 auto; padding: 32px 16px 80px; }
.intro h1 { margin: 0 0 8px; font-size: 2.25rem; font-weight: 700; }
.intro p { margin: 0; max-width: 70ch; color: rgba(255,255,255,0.65); line-height: 1.6; }
.band { margin: 40px 0 14px; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(255,255,255,0.5); }
.desktop { display: grid; grid-template-columns: repeat(auto-fit, minmax(520px, 1fr)); gap: 16px; }
.panel { background: var(--overlay-gray); border-radius: 14px; padding: 1.35rem 1.4rem 1.4rem; min-width: 0; }
.kicker { display: block; color: rgba(255,255,255,0.5); font-size: 0.72rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
.panelTitle { margin: 0.2rem 0 0.9rem; font-size: 1.35rem; font-weight: 700; }
.phones { display: flex; flex-wrap: wrap; gap: 24px; }
.phone { width: 390px; max-width: 100%; background: #1c1d21; border-radius: 22px; padding: 16px; }
.phone .panel { padding: 1rem 0.7rem 1.1rem; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; max-width: 900px; }
.card { display: flex; gap: 14px; background: var(--overlay-gray); border-radius: 14px; padding: 16px; cursor: pointer; }
.radio { flex: none; width: 20px; height: 20px; border-radius: 50%; background: #33343a; margin-top: 2px; }
.cardWords h4 { margin: 0 0 4px; font-size: 1rem; }
