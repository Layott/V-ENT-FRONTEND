<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>V-ENT Admin — Login</title>
  <link rel="icon" href="../../public/images/logo_mark_red.svg" type="image/svg+xml" />
  <style>
    @import url("https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@200,300,400,500,600,700,800&f[]=editorial-new@200,400,500,700,800&display=swap");
    /* ── Clash Grotesk (mirroring clash-grotesk.css) ────────────────── */
    @font-face {
      font-family: "ClashGrotesk-Regular";
      src: url("../../public/fonts/clash_grotesk/ClashGrotesk-Regular.woff2") format("woff2"),
           url("../../public/fonts/clash_grotesk/ClashGrotesk-Regular.woff") format("woff");
      font-weight: 400; font-display: swap;
    }
    @font-face {
      font-family: "ClashGrotesk-Light";
      src: url("../../public/fonts/clash_grotesk/ClashGrotesk-Light.woff2") format("woff2"),
           url("../../public/fonts/clash_grotesk/ClashGrotesk-Light.woff") format("woff");
      font-weight: 300; font-display: swap;
    }
    @font-face {
      font-family: "ClashGrotesk-Medium";
      src: url("../../public/fonts/clash_grotesk/ClashGrotesk-Medium.woff2") format("woff2"),
           url("../../public/fonts/clash_grotesk/ClashGrotesk-Medium.woff") format("woff");
      font-weight: 500; font-display: swap;
    }
    @font-face {
      font-family: "ClashGrotesk-Semibold";
      src: url("../../public/fonts/clash_grotesk/ClashGrotesk-Semibold.woff2") format("woff2"),
           url("../../public/fonts/clash_grotesk/ClashGrotesk-Semibold.woff") format("woff");
      font-weight: 600; font-display: swap;
    }
    @font-face {
      font-family: "ClashGrotesk-Bold";
      src: url("../../public/fonts/clash_grotesk/ClashGrotesk-Bold.woff2") format("woff2"),
           url("../../public/fonts/clash_grotesk/ClashGrotesk-Bold.woff") format("woff");
      font-weight: 700; font-display: swap;
    }

    /* ── CSS Variables — exact copies from globals.css + admin-overview ── */
    :root {
      --v-ent-red:        #ED1C24;
      --v-ent-light-red:  #FF3B45;
      --v-ent-grn:        #2E8B3E;
      --v-ent-light-grn:  #3FB554;
      --overlay-gray:     #212225;
      --surface-2:        #303136;
      --page-bg:          #131316;
      --header-bg:        #17181A;
      --border-subtle:    rgba(255,255,255,0.25);
      --border-faint:     rgba(255,255,255,0.08);
      --border-divider:   rgba(204,204,204,0.3);
      --text-white:       #ffffff;
      --text-muted:       #A7A6A6;
      --text-dim:         rgba(255,255,255,0.45);
      --v-ent-red-deep:   #8A0F18;
      --v-ent-red-soft:   #FF3B45;
      --v-ent-gold:       #C9A227;
      --v-ent-gold-bright:#E8BF3D;
      --v-ent-gold-dim:   #7A6118;
      --gold-soft-bg:     rgba(201,162,39,0.18);
      --confirm-green:    #2E8B3E;
      --confirm-green-hi: #3FB554;
      --font-display:     "Editorial New", "ClashGrotesk-Bold", Georgia, serif;
      --font-body:        "Cabinet Grotesk", "ClashGrotesk-Regular", "Inter", system-ui, sans-serif;
      --font-numeric:     "ClashGrotesk-Medium", "Cabinet Grotesk", monospace;
    }

    /* ── Reset ─────────────────────────────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Cabinet Grotesk", "ClashGrotesk-Regular", "Inter", system-ui, sans-serif;
      background-color: var(--page-bg);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
    }

    /* ── Login card ─────────────────────────────────────────────────── */
    .login-card {
      width: 100%;
      max-width: 420px;
      background-color: var(--overlay-gray);
      border-radius: 10px;
      padding: 2rem;
      border: 1px solid var(--border-faint);
    }

    /* ── Logo block ─────────────────────────────────────────────────── */
    .logo-block {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      margin-bottom: 0.75rem;
    }
    .logo-img {
      height: 28px;
      width: auto;
    }
    .logo-text {
      font-family: "ClashGrotesk-Medium", sans-serif;
      font-size: 1.75rem;
      color: var(--v-ent-red);
      line-height: 1;
      letter-spacing: -0.02em;
    }

    /* ── Portal label ───────────────────────────────────────────────── */
    .portal-label {
      font-family: "ClashGrotesk-Regular", sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.35);
      margin-bottom: 0.85rem;
    }

    /* ── Divider ────────────────────────────────────────────────────── */
    .card-divider {
      height: 1px;
      background: var(--border-faint);
      margin-bottom: 1.25rem;
    }

    /* ── Heading block ──────────────────────────────────────────────── */
    .card-heading {
      font-family: "ClashGrotesk-Semibold", sans-serif;
      font-size: 1.2rem;
      color: var(--text-white);
      margin-bottom: 0.35rem;
    }
    .card-subheading {
      font-family: "ClashGrotesk-Light", sans-serif;
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }

    /* ── Form fields ────────────────────────────────────────────────── */
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .field label {
      font-family: "ClashGrotesk-Regular", sans-serif;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.7);
      letter-spacing: 0.02em;
    }

    .field-wrap {
      position: relative;
    }

    .field input {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border-faint);
      border-radius: 6px;
      padding: 0.65rem 0.85rem;
      font-family: "ClashGrotesk-Regular", sans-serif;
      font-size: 0.9rem;
      color: var(--text-white);
      outline: none;
      transition: border-color 0.2s ease;
    }
    .field input::placeholder {
      color: rgba(255, 255, 255, 0.2);
    }
    .field input:focus {
      border-color: rgba(237, 28, 36, 0.5);
    }
    .field input.error-state {
      border-color: var(--v-ent-red);
    }

    /* Password toggle eye */
    .toggle-eye {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      color: rgba(255, 255, 255, 0.35);
      transition: color 0.2s ease;
    }
    .toggle-eye:hover { color: rgba(255, 255, 255, 0.65); }
    .field input[type="password"],
    .field input[type="text"] {
      padding-right: 2.5rem;
    }

    /* Inline field error */
    .field-error {
      font-family: "ClashGrotesk-Light", sans-serif;
      font-size: 0.75rem;
      color: var(--v-ent-red);
      display: none;
      margin-top: 0.15rem;
    }
    .field-error.visible { display: block; }

    /* Shake animation */
    @keyframes shake {
      0%   { transform: translateX(0); }
      15%  { transform: translateX(-6px); }
      30%  { transform: translateX(6px); }
      45%  { transform: translateX(-5px); }
      60%  { transform: translateX(5px); }
      75%  { transform: translateX(-3px); }
      90%  { transform: translateX(3px); }
      100% { transform: translateX(0); }
    }
    .shake { animation: shake 0.42s ease; }

    /* ── Submit button ───────────────────────────────────────────────── */
    .btn-signin {
      width: 100%;
      background-color: var(--v-ent-red);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 0.7rem 1rem;
      font-family: "ClashGrotesk-Semibold", sans-serif;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.2s ease, opacity 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .btn-signin:hover:not(:disabled) {
      background-color: var(--v-ent-light-red);
    }
    .btn-signin:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    /* Spinner */
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-signin.loading .spinner { display: block; }

    /* ── Support note ───────────────────────────────────────────────── */
    .support-note {
      font-family: "ClashGrotesk-Light", sans-serif;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.3);
      text-align: center;
    }
    .support-note a {
      color: rgba(255, 255, 255, 0.45);
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .support-note a:hover { color: var(--text-muted); }

    /* ── Security warning banner ────────────────────────────────────── */
    .security-banner {
      width: 100%;
      max-width: 420px;
      margin-top: 1.25rem;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border-faint);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
    }
    .security-banner svg {
      flex-shrink: 0;
      margin-top: 1px;
      color: rgba(255,255,255,0.25);
    }
    .security-banner-text {
      font-family: "ClashGrotesk-Light", sans-serif;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.3);
      line-height: 1.55;
    }

    /* ── Toast notification ─────────────────────────────────────────── */
    .toast-container {
      position: fixed;
      top: 1.25rem;
      right: 1.25rem;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      pointer-events: none;
    }
    .toast {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-family: "ClashGrotesk-Regular", sans-serif;
      font-size: 0.85rem;
      color: #fff;
      min-width: 260px;
      max-width: 340px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      pointer-events: auto;
      animation: toast-in 0.25s ease;
    }
    @keyframes toast-in {
      from { opacity: 0; transform: translateX(20px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .toast.toast-error {
      background: rgba(237, 28, 36, 0.15);
      border: 1px solid rgba(237, 28, 36, 0.35);
    }
    .toast.toast-success {
      background: rgba(76, 175, 80, 0.15);
      border: 1px solid rgba(76, 175, 80, 0.35);
    }
    .toast-icon { flex-shrink: 0; }
    .toast-msg { flex: 1; line-height: 1.4; }
    .toast-dismiss {
      background: none;
      border: none;
      color: rgba(255,255,255,0.4);
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      padding: 0;
      flex-shrink: 0;
    }
    .toast-dismiss:hover { color: rgba(255,255,255,0.7); }

    /* ── Responsive ─────────────────────────────────────────────────── */
    @media (max-width: 480px) {
      body { padding: 1rem 1rem; justify-content: flex-start; padding-top: 3rem; }
      .login-card { padding: 1.5rem 1rem; }
      .toast-container { top: 0.75rem; right: 0.75rem; left: 0.75rem; }
      .toast { min-width: unset; max-width: 100%; }
    }
  </style>
</head>
<body>

  <!-- Toast container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Login card -->
  <div class="login-card">

    <!-- Logo -->
    <div class="logo-block">
      <img class="logo-img" src="../../public/images/logo_mark_red.svg" alt="V-ENT logo" />
      <span class="logo-text">v-ent</span>
    </div>

    <!-- Portal label -->
    <p class="portal-label">Admin Portal</p>

    <!-- Divider -->
    <div class="card-divider"></div>

    <!-- Heading -->
    <h1 class="card-heading">Sign in to Admin</h1>
    <p class="card-subheading">This portal is restricted to authorized V-ENT administrators.</p>

    <!-- Form -->
    <form id="loginForm" novalidate>
      <div class="field-group">

        <!-- Username -->
        <div class="field" id="usernameField">
          <label for="username">Username</label>
          <div class="field-wrap">
            <input
              type="text"
              id="username"
              name="username"
              placeholder="admin username"
              autocomplete="username"
              spellcheck="false"
            />
          </div>
          <span class="field-error" id="usernameError">This field is required</span>
        </div>

        <!-- Password -->
        <div class="field" id="passwordField">
          <label for="password">Password</label>
          <div class="field-wrap">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              autocomplete="current-password"
            />
            <button
              type="button"
              class="toggle-eye"
              id="toggleEye"
              aria-label="Toggle password visibility"
            >
              <!-- Eye open icon -->
              <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <!-- Eye closed icon -->
              <svg id="eyeClosed" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
          <span class="field-error" id="passwordError">This field is required</span>
        </div>

      </div>

      <!-- Submit button -->
      <button type="submit" class="btn-signin" id="btnSignIn">
        <span class="spinner" id="btnSpinner"></span>
        <span id="btnLabel">Sign In</span>
      </button>
    </form>

    <!-- Support note -->
    <p class="support-note">
      Having trouble? Contact <a href="mailto:superadmin@v-ent.gg">superadmin@v-ent.gg</a>
    </p>

  </div>

  <!-- Security warning banner -->
  <div class="security-banner">
    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
    <p class="security-banner-text">
      This is a secured admin area. All login attempts are logged. Unauthorized access is prohibited.
    </p>
  </div>

  <script>
    /* ── Password show / hide toggle ────────────────────────────────── */
    const passwordInput = document.getElementById('password');
    const toggleEye     = document.getElementById('toggleEye');
    const eyeOpen       = document.getElementById('eyeOpen');
    const eyeClosed     = document.getElementById('eyeClosed');

    toggleEye.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      eyeOpen.style.display   = isPassword ? 'none'  : 'block';
      eyeClosed.style.display = isPassword ? 'block' : 'none';
    });

    /* ── Toast helper ───────────────────────────────────────────────── */
    function showToast(message, type = 'error', duration = 4000) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;

      const icon = type === 'error'
        ? `<svg class="toast-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`
        : `<svg class="toast-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;

      toast.innerHTML = `
        ${icon}
        <span class="toast-msg">${message}</span>
        <button class="toast-dismiss" aria-label="Dismiss">&times;</button>
      `;

      toast.querySelector('.toast-dismiss').addEventListener('click', () => toast.remove());
      container.appendChild(toast);

      if (duration > 0) {
        setTimeout(() => {
          if (toast.parentNode) toast.remove();
        }, duration);
      }

      return toast;
    }

    /* ── Field validation helpers ───────────────────────────────────── */
    function shakeField(fieldId) {
      const field = document.getElementById(fieldId);
      field.classList.remove('shake');
      // Force reflow so re-adding the class triggers animation
      void field.offsetWidth;
      field.classList.add('shake');
      field.addEventListener('animationend', () => field.classList.remove('shake'), { once: true });
    }

    function setFieldError(inputId, errorId, hasError) {
      const input = document.getElementById(inputId);
      const error = document.getElementById(errorId);
      if (hasError) {
        input.classList.add('error-state');
        error.classList.add('visible');
      } else {
        input.classList.remove('error-state');
        error.classList.remove('visible');
      }
    }

    // Clear error on input
    document.getElementById('username').addEventListener('input', () => {
      setFieldError('username', 'usernameError', false);
    });
    document.getElementById('password').addEventListener('input', () => {
      setFieldError('password', 'passwordError', false);
    });

    /* ── Form submit ────────────────────────────────────────────────── */
    const loginForm   = document.getElementById('loginForm');
    const btnSignIn   = document.getElementById('btnSignIn');
    const btnSpinner  = document.getElementById('btnSpinner');
    const btnLabel    = document.getElementById('btnLabel');

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      let hasError = false;

      if (!username) {
        setFieldError('username', 'usernameError', true);
        shakeField('usernameField');
        hasError = true;
      }
      if (!password) {
        setFieldError('password', 'passwordError', true);
        shakeField('passwordField');
        hasError = true;
      }

      if (hasError) return;

      // Loading state
      btnSignIn.disabled = true;
      btnSignIn.classList.add('loading');
      btnSpinner.style.display = 'block';
      btnLabel.textContent = 'Signing in\u2026';

      setTimeout(() => {
        // Reset button state
        btnSignIn.disabled = false;
        btnSignIn.classList.remove('loading');
        btnSpinner.style.display = 'none';

        // Demo credentials check
        if (username === 'superadmin' && password === 'admin123') {
          btnLabel.textContent = 'Sign In';
          const successToast = showToast('Login successful. Redirecting to dashboard\u2026', 'success', 0);
          setTimeout(() => {
            successToast.remove();
            // Simulate redirect by updating hash
            window.location.hash = '#/admin/overview';
          }, 1500);
        } else {
          btnLabel.textContent = 'Sign In';
          showToast('Invalid credentials. Please try again.', 'error', 5000);
        }
      }, 1200);
    });
  </script>

</body>
</html>
